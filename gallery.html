<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片墙 - Wangxinyan</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="sub-page">

<nav class="navbar">
    <div class="nav-brand">Wangxinyan</div>
    <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="about.html">关于我</a>
        <a href="timeline.html">时间轴</a>
    </div>
</nav>

<main>
    <section class="section">
        <div class="section-title">
            <span>Gallery</span>
            <h2>我的照片墙</h2>
        </div>

        <div class="gallery-page-grid">
            <div class="gallery-card big">
                <img src="images/life.jpg" alt="生活照片">
                <div class="gallery-text">
                    <h3>Life</h3>
                    <p>生活记录</p>
                </div>
            </div>

            <div class="gallery-card">
                <img src="images/study1.jpg" alt="学习照片">
                <div class="gallery-text">
                    <h3>Study</h3>
                    <p>学习时刻</p>
                </div>
            </div>

            <div class="gallery-card">
                <img src="images/study2.jpg" alt="校园照片">
                <div class="gallery-text">
                    <h3>Campus</h3>
                    <p>校园记忆</p>
                </div>
            </div>

            <div class="gallery-card wide">
                <img src="images/travel1.jpg" alt="旅行照片">
                <div class="gallery-text">
                    <h3>Travel</h3>
                    <p>旅行见闻</p>
                </div>
            </div>

            <div class="gallery-card">
                <img src="images/avatar.jpg" alt="个人照片">
                <div class="gallery-text">
                    <h3>Portrait</h3>
                    <p>个人照片</p>
                </div>
            </div>
        </div>
    </section>
</main>

<div id="imagePreview" class="image-preview">
    <span id="closePreview">×</span>
    <img id="previewImg" src="" alt="预览图">
</div>

<script src="script.js"></script>
</body>
</html>
